name: CI Build & Test
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint code
        run: npm run lint

      - name: Unit test
        run: npm run test

      - name: Build project
        run: npm run build

      - name: Upload build dist
        uses: actions/upload-artifact@v4
        with:
          name: dist-output
          path: dist/
